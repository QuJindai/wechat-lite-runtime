services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
    - ..:/workspaces/wechat-lite-runtime:cached
    environment:
      WECHAT_STATE_DIR: /workspaces/wechat-lite-runtime/state
      WECHAT_WEB_HOST: wechat
      WECHAT_WEB_PORT: '3001'
      WECHAT_PROBE_TIMEOUT: '0.5'
      WECHAT_LAUNCHER_ENDPOINT: http://wechat:8790/open
  wechat:
    image: ghcr.io/nickrunning/wechat-selkies:0.0.16
    restart: unless-stopped
    entrypoint:
    - /bin/bash
    - -lc
    - |
      mkdir -p /custom-services.d
      cp /opt/wechat-lite/wechat-launcher-service.py /custom-services.d/wechat-launcher
      chmod 0755 /custom-services.d/wechat-launcher
      exec /init
    volumes:
    - ../state:/config
    - ../scripts/wechat-launcher-service.py:/opt/wechat-lite/wechat-launcher-service.py:ro
    shm_size: 1gb
    environment:
      PUID: '1000'
      PGID: '100'
      TZ: Asia/Shanghai
      LC_ALL: zh_CN.UTF-8
      AUTO_START_WECHAT: 'true'
      AUTO_START_QQ: 'false'
      ENABLE_WECHAT_AUTO_LOGIN: 'true'
      AUTO_LOGIN_DELAY: '3'
      WECHAT_LAUNCHER_HOST: 0.0.0.0
      CUSTOM_USER: ${SELKIES_USER:-}
      PASSWORD: ${SELKIES_PASSWORD:-}
