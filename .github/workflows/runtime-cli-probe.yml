name: Runtime CLI Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v1-public-account-discovery
    paths:
      - '.github/workflows/runtime-cli-probe.yml'
      - '.devcontainer/**'

permissions:
  contents: write

jobs:
  runtime-cli-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WECHAT_IMAGE: ghcr.io/nickrunning/wechat-selkies:0.0.16
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated probe state
        run: |
          mkdir -p state-runtime-cli-probe /tmp/runtime-cli-probe
          printf 'WECHAT_IMAGE=%s\n' "$WECHAT_IMAGE" > /tmp/runtime-cli-probe/context.txt
          printf 'state_dir=state-runtime-cli-probe\n' >> /tmp/runtime-cli-probe/context.txt

      - name: Start real WeChat container
        run: |
          docker compose -f .devcontainer/docker-compose.yml up -d wechat
          cid="$(docker compose -f .devcontainer/docker-compose.yml ps -q wechat)"
          test -n "$cid"
          echo "$cid" > /tmp/runtime-cli-probe/container-id.txt
          for i in $(seq 1 90); do
            if docker exec "$cid" bash -lc 'timeout 1 bash -c "</dev/tcp/127.0.0.1/3001"' 2>/dev/null; then
              echo 'port_3001=ready' >> /tmp/runtime-cli-probe/context.txt
              exit 0
            fi
            sleep 2
          done
          echo 'port_3001=not_ready' >> /tmp/runtime-cli-probe/context.txt
          exit 1

      - name: Probe Radium and browser process arguments
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'ps -eo pid,args 2>/dev/null || ps aux' 2>/dev/null \
            | grep -Ei 'Radium|WMPF|WeChatAppEx|chrome|chromium|cef' \
            | sed -E 's#(--user-data-dir=)[^ ]+#\1<redacted>#g; s#(--profile-directory=)[^ ]+#\1<redacted>#g; s#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/processes.txt || true

      - name: Probe listening localhost ports
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || cat /proc/net/tcp /proc/net/tcp6 2>/dev/null || true' \
            | sed -E 's#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/listeners.txt || true

      - name: Probe Chromium DevTools HTTP endpoints
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            printf 'candidate_ports=9222,9223,9229,9333,9444\n'
            for port in 9222 9223 9229 9333 9444; do
              for endpoint in /json/version /json/list; do
                body="$(docker exec "$cid" python3 -c "import urllib.request,sys; print(urllib.request.urlopen('http://127.0.0.1:'+sys.argv[1]+sys.argv[2], timeout=1).read(4096).decode('utf-8','replace'))" "$port" "$endpoint" 2>/dev/null || true)"
                if [ -n "$body" ]; then
                  printf 'CDP_HIT port=%s endpoint=%s\n' "$port" "$endpoint"
                  printf '%s\n' "$body" | sed -E 's#(webSocketDebuggerUrl"[[:space:]]*:[[:space:]]*")[^"]+#\1<redacted>#g'
                fi
              done
            done
          } > /tmp/runtime-cli-probe/devtools.txt

      - name: Identify port 8082 owner and HTTP behavior
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            echo 'base=http://127.0.0.1:8082'
            echo '--- ownership ---'
            docker exec "$cid" bash -lc 'if command -v lsof >/dev/null 2>&1; then lsof -nP -iTCP:8082 -sTCP:LISTEN; elif command -v fuser >/dev/null 2>&1; then fuser -n tcp 8082 -v; else ps -eo pid,args | grep -E "8082|selkies|webrtc|websockify|python|nginx" | grep -v grep; fi' 2>&1 || true
            echo '--- http ---'
            for endpoint in / /json/version /json/list /health /metrics; do
              printf 'ENDPOINT %s\n' "$endpoint"
              docker exec "$cid" python3 -c "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8082'+sys.argv[1], timeout=2); print('status='+str(r.status)); print(r.read(4096).decode('utf-8','replace'))" "$endpoint" 2>/dev/null \
                | sed -E 's#(webSocketDebuggerUrl"[[:space:]]*:[[:space:]]*")[^"]+#\1<redacted>#g' || true
            done
          } > /tmp/runtime-cli-probe/port-8082.txt

      - name: Probe runtime text configuration hints
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'find /opt/wechat /etc /usr/local/bin -type f -size -2M 2>/dev/null -print0 | xargs -0 -r grep -I -nE "remote-debugging|8082" 2>/dev/null | head -n 200' \
            | sed -E 's#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/runtime-config-hints.txt || true

      - name: Persist sanitized CLI summary
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p docs
          {
            echo '# Runtime CLI Probe Latest'
            echo
            echo "- head_sha: \`${GITHUB_SHA}\`"
            echo
            echo '## Context'
            echo '```text'
            cat /tmp/runtime-cli-probe/context.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Radium / browser processes'
            echo '```text'
            head -n 120 /tmp/runtime-cli-probe/processes.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Listening ports'
            echo '```text'
            head -n 120 /tmp/runtime-cli-probe/listeners.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## DevTools probe'
            echo '```text'
            cat /tmp/runtime-cli-probe/devtools.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Port 8082 probe'
            echo '```text'
            head -n 160 /tmp/runtime-cli-probe/port-8082.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Runtime configuration hints'
            echo '```text'
            head -n 200 /tmp/runtime-cli-probe/runtime-config-hints.txt 2>/dev/null || true
            echo '```'
          } > docs/runtime-cli-probe-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime-cli-probe-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record runtime CLI probe'
            git push
          fi

      - name: Upload sanitized CLI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cli-probe
          path: /tmp/runtime-cli-probe/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v || true
