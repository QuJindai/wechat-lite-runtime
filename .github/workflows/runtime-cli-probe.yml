name: Runtime CLI Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v1-public-account-discovery
    paths:
      - '.github/workflows/runtime-cli-probe.yml'
      - '.devcontainer/**'

permissions:
  contents: write

jobs:
  runtime-cli-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WECHAT_IMAGE: ghcr.io/nickrunning/wechat-selkies:0.0.16
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated probe state
        run: |
          mkdir -p state-runtime-cli-probe /tmp/runtime-cli-probe
          printf 'WECHAT_IMAGE=%s\n' "$WECHAT_IMAGE" > /tmp/runtime-cli-probe/context.txt
          printf 'state_dir=state-runtime-cli-probe\n' >> /tmp/runtime-cli-probe/context.txt

      - name: Start real WeChat container
        run: |
          docker compose -f .devcontainer/docker-compose.yml up -d wechat
          cid="$(docker compose -f .devcontainer/docker-compose.yml ps -q wechat)"
          test -n "$cid"
          echo "$cid" > /tmp/runtime-cli-probe/container-id.txt
          for i in $(seq 1 90); do
            if docker exec "$cid" bash -lc 'timeout 1 bash -c "</dev/tcp/127.0.0.1/3001"' 2>/dev/null; then
              echo 'port_3001=ready' >> /tmp/runtime-cli-probe/context.txt
              exit 0
            fi
            sleep 2
          done
          echo 'port_3001=not_ready' >> /tmp/runtime-cli-probe/context.txt
          exit 1

      - name: Probe Radium and browser process arguments
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'ps -eo pid,args 2>/dev/null || ps aux' 2>/dev/null \
            | grep -Ei 'Radium|WMPF|WeChatAppEx|chrome|chromium|cef' \
            | sed -E 's#(--user-data-dir=)[^ ]+#\1<redacted>#g; s#(--profile-directory=)[^ ]+#\1<redacted>#g; s#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/processes.txt || true

      - name: Probe listening localhost ports
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || cat /proc/net/tcp /proc/net/tcp6 2>/dev/null || true' \
            | sed -E 's#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/listeners.txt || true

      - name: Probe Chromium DevTools HTTP endpoints
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            printf 'candidate_ports=9222,9223,9229,9333,9444\n'
            for port in 9222 9223 9229 9333 9444; do
              for endpoint in /json/version /json/list; do
                body="$(docker exec "$cid" python3 -c "import urllib.request,sys; print(urllib.request.urlopen('http://127.0.0.1:'+sys.argv[1]+sys.argv[2], timeout=1).read(4096).decode('utf-8','replace'))" "$port" "$endpoint" 2>/dev/null || true)"
                if [ -n "$body" ]; then
                  printf 'CDP_HIT port=%s endpoint=%s\n' "$port" "$endpoint"
                  printf '%s\n' "$body" | sed -E 's#(webSocketDebuggerUrl"[[:space:]]*:[[:space:]]*")[^"]+#\1<redacted>#g'
                fi
              done
            done
          } > /tmp/runtime-cli-probe/devtools.txt

      - name: Identify port 8082 owner and HTTP behavior
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            echo 'base=http://127.0.0.1:8082'
            echo '--- ownership ---'
            docker exec "$cid" bash -lc 'if command -v lsof >/dev/null 2>&1; then lsof -nP -iTCP:8082 -sTCP:LISTEN; elif command -v fuser >/dev/null 2>&1; then fuser -n tcp 8082 -v; else ps -eo pid,args | grep -E "8082|selkies|webrtc|websockify|python|nginx" | grep -v grep; fi' 2>&1 || true
            echo '--- http ---'
            for endpoint in / /json/version /json/list /health /metrics; do
              printf 'ENDPOINT %s\n' "$endpoint"
              docker exec "$cid" python3 -c "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8082'+sys.argv[1], timeout=2); print('status='+str(r.status)); print(r.read(4096).decode('utf-8','replace'))" "$endpoint" 2>/dev/null \
                | sed -E 's#(webSocketDebuggerUrl"[[:space:]]*:[[:space:]]*")[^"]+#\1<redacted>#g' || true
            done
          } > /tmp/runtime-cli-probe/port-8082.txt

      - name: Probe runtime text configuration hints
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          docker exec "$cid" bash -lc 'find /opt/wechat /etc /usr/local/bin -type f -size -2M 2>/dev/null -print0 | xargs -0 -r grep -I -nE "remote-debugging|8082" 2>/dev/null | head -n 200' \
            | sed -E 's#(/config/)[^ ]+#\1<redacted>#g' \
            > /tmp/runtime-cli-probe/runtime-config-hints.txt || true

      - name: Probe X11 controller capability and WeChat window metadata
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            echo 'DISPLAY=:1'
            echo '--- commands ---'
            for command_name in xdotool xprop xclip; do
              printf '%s=' "$command_name"
              docker exec "$cid" bash -lc "command -v $command_name 2>/dev/null || true"
            done
            echo '--- visible wechat windows ---'
            docker exec "$cid" bash -lc '
              export DISPLAY=:1
              ids="$(xdotool search --onlyvisible --class wechat 2>/dev/null || true)"
              if [ -z "$ids" ]; then
                echo WECHAT_WINDOWS=0
                exit 0
              fi
              count=0
              for id in $ids; do
                count=$((count+1))
                echo WINDOW_INDEX=$count
                xdotool getwindowgeometry --shell "$id" 2>/dev/null || true
                xdotool getwindowname "$id" 2>/dev/null | sed -E "s/.*/NAME=<redacted>/" || true
                xprop -id "$id" WM_CLASS _NET_WM_NAME WM_NAME 2>/dev/null \
                  | sed -E "s/(_NET_WM_NAME|WM_NAME)\(.*/\1=<redacted>/" || true
              done
              echo WECHAT_WINDOWS=$count
            ' 2>&1
          } > /tmp/runtime-cli-probe/x11.txt

      - name: Probe Linux WeChat URL handler and deep-link registration
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          {
            echo '--- desktop candidates ---'
            docker exec "$cid" bash -lc '
              find /usr/share/applications -maxdepth 1 -type f -iname "*wechat*.desktop" 2>/dev/null | sort -u | while IFS= read -r desktop; do
                [ -n "$desktop" ] || continue
                echo DESKTOP_DISCOVERED=$desktop
                grep -E "^Name=" "$desktop" || true
                grep -E "^Exec=" "$desktop" || true
                grep -E "^MimeType=" "$desktop" || true
              done
            ' 2>/dev/null || true
            echo '--- x-scheme-handler/weixin ---'
            docker exec "$cid" bash -lc 'command -v xdg-mime >/dev/null 2>&1 && xdg-mime query default x-scheme-handler/weixin || true' 2>/dev/null || true
            echo '--- registrations ---'
            docker exec "$cid" bash -lc 'grep -R -I -n -E "x-scheme-handler/weixin|weixin://|wxwork://" /usr/share/applications /opt/wechat 2>/dev/null | head -n 200' \
              | sed -E 's#(/config/)[^ ]+#\1<redacted>#g' || true
          } > /tmp/runtime-cli-probe/url-handler.txt

      - name: Invoke HTTPS public-account profile URL through Linux WeChat
        if: always()
        run: |
          cid="$(cat /tmp/runtime-cli-probe/container-id.txt 2>/dev/null || true)"
          test -n "$cid" || exit 0
          target_url='https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=AUTOTEST_BIZ&scene=124#wechat_redirect'
          before_windows="$(docker exec -e DISPLAY=:1 "$cid" bash -lc 'xdotool search --onlyvisible --class wechat 2>/dev/null | wc -l' 2>/dev/null || echo 0)"
          set +e
          docker exec -e DISPLAY=:1 -e TARGET_URL="$target_url" "$cid" bash -lc 'timeout 12s /usr/bin/wechat "$TARGET_URL" >/tmp/url-invoke-command.log 2>&1'
          invoke_exit=$?
          set -e
          sleep 6
          after_windows="$(docker exec -e DISPLAY=:1 "$cid" bash -lc 'xdotool search --onlyvisible --class wechat 2>/dev/null | wc -l' 2>/dev/null || echo 0)"
          history_rows="$(docker exec "$cid" python3 -c 'import pathlib,sqlite3; total=0; root=pathlib.Path("/config/.xwechat/radium/web/profiles");
for p in root.glob("*/History") if root.exists() else []:
    try:
        c=sqlite3.connect("file:"+str(p)+"?mode=ro",uri=True); total+=int(c.execute("SELECT count(*) FROM urls WHERE url LIKE ?",("%AUTOTEST_BIZ%",)).fetchone()[0]); c.close()
    except Exception: pass
print(total)' 2>/dev/null || echo 0)"
          raw_marker_files="$(docker exec "$cid" bash -lc 'if [ -d /config/.xwechat/radium/web ]; then grep -R -a -l -F "AUTOTEST_BIZ" /config/.xwechat/radium/web 2>/dev/null | wc -l; else echo 0; fi' 2>/dev/null || echo 0)"
          {
            echo "URL_INVOKE_EXIT=$invoke_exit"
            echo "WINDOWS_BEFORE=$before_windows"
            echo "WINDOWS_AFTER=$after_windows"
            echo "HISTORY_MARKER_ROWS=$history_rows"
            echo "RAW_MARKER_FILES=$raw_marker_files"
          } > /tmp/runtime-cli-probe/url-invocation.txt

      - name: Persist sanitized CLI summary
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p docs
          {
            echo '# Runtime CLI Probe Latest'
            echo
            echo "- head_sha: \`${GITHUB_SHA}\`"
            echo
            echo '## Context'
            echo '```text'
            cat /tmp/runtime-cli-probe/context.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Radium / browser processes'
            echo '```text'
            head -n 120 /tmp/runtime-cli-probe/processes.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Listening ports'
            echo '```text'
            head -n 120 /tmp/runtime-cli-probe/listeners.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## DevTools probe'
            echo '```text'
            cat /tmp/runtime-cli-probe/devtools.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Port 8082 probe'
            echo '```text'
            head -n 160 /tmp/runtime-cli-probe/port-8082.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Runtime configuration hints'
            echo '```text'
            head -n 200 /tmp/runtime-cli-probe/runtime-config-hints.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## X11 capability'
            echo '```text'
            head -n 200 /tmp/runtime-cli-probe/x11.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## URL handler capability'
            echo '```text'
            head -n 240 /tmp/runtime-cli-probe/url-handler.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## URL invocation capability'
            echo '```text'
            cat /tmp/runtime-cli-probe/url-invocation.txt 2>/dev/null || true
            echo '```'
          } > docs/runtime-cli-probe-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime-cli-probe-latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record runtime CLI probe'
            git push
          fi

      - name: Upload sanitized CLI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-cli-probe
          path: /tmp/runtime-cli-probe/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v || true
