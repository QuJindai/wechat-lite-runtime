name: Live Discovery Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/v1-public-account-discovery
    paths:
      - '.devcontainer/docker-compose.yml'
      - 'scripts/wechat-launcher-service.py'
      - 'app/launcher_bridge.py'
      - 'app/live_discovery.py'
      - 'app/live_transport.py'
      - 'app/main.py'
      - '.github/workflows/live-discovery-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  default-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ephemeral runtime token
        run: |
          mkdir -p state
          printf '%s\n' 'test-control-token' > state/.control-token
          chmod 600 state/.control-token

      - name: Start WeChat and workspace
        run: docker compose -f .devcontainer/docker-compose.yml up -d wechat workspace

      - name: Wait for launcher and WeChat
        run: |
          for i in $(seq 1 90); do
            if docker compose -f .devcontainer/docker-compose.yml exec -T workspace \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=1).read()" 2>/dev/null && \
               docker compose -f .devcontainer/docker-compose.yml exec -T wechat \
              bash -lc "pgrep -f '/opt/wechat/wechat|/usr/bin/wechat' >/dev/null"; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f .devcontainer/docker-compose.yml logs wechat || true
          exit 1

      - name: Install control API dependencies
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T workspace \
            bash -lc 'cd /workspaces/wechat-lite-runtime && python -m pip install -q -r requirements.txt'

      - name: Start default FastAPI wiring
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T workspace \
            bash -lc 'cd /workspaces/wechat-lite-runtime && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8787 >/tmp/live-discovery-api.log 2>&1 &'
          for i in $(seq 1 40); do
            if docker compose -f .devcontainer/docker-compose.yml exec -T workspace \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=1).read()" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f .devcontainer/docker-compose.yml exec -T workspace cat /tmp/live-discovery-api.log || true
          exit 1

      - name: Verify bootstrap reaches container launcher and stays secret-safe
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T workspace python - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              'http://127.0.0.1:8787/v1/public-accounts/bootstrap',
              data=json.dumps({'biz': 'TEST_BIZ'}).encode(),
              headers={'Authorization': 'Bearer test-control-token', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.loads(response.read().decode())
          print(json.dumps(payload, sort_keys=True))
          assert payload['status'] == 'CREDENTIAL_NOT_OBSERVED', payload
          assert payload['credential_observed'] is False, payload
          assert payload['launch']['dispatch_attempted'] is True, payload
          assert payload['launch']['exit_code'] in (0, 255), payload
          assert payload['sensitive_values_returned'] is False, payload
          rendered = json.dumps(payload)
          assert 'TEST_BIZ' not in rendered
          assert 'test-control-token' not in rendered
          PY

      - name: Verify discover fails cleanly without logged-in credential
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T workspace python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          req = urllib.request.Request(
              'http://127.0.0.1:8787/v1/public-accounts/discover',
              data=json.dumps({'account_name': 'Smoke Account', 'biz': 'TEST_BIZ', 'limit': 20}).encode(),
              headers={'Authorization': 'Bearer test-control-token', 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              raise AssertionError('discover unexpectedly succeeded without a logged-in credential')
          except urllib.error.HTTPError as exc:
              body = exc.read().decode()
              payload = json.loads(body)
              print(json.dumps(payload, sort_keys=True))
              assert exc.code == 503, (exc.code, payload)
              assert payload['detail']['code'] == 'HISTORY_SURFACE_UNAVAILABLE', payload
              assert 'TEST_BIZ' not in body
              assert 'test-control-token' not in body
          PY

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v || true
